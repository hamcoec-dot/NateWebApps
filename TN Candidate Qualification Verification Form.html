        }

        .form-group select {

            font-size: 14px;

        .button-group {

            margin-top: 15px;
        }

        button {

            font-size: 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        .btn-primary {
            background-color: #208091;
            color: white;
        }

        .btn-primary:hover {

        }

        .btn-secondary {
            background-color: #e0e0e0;
            color: #1f2121;
        }

        .btn-secondary:hover {
            background-color: #d0d0d0;
        }

        #formPreview {
            background: white;
            padding: 0;
            display: none;
        }

        .print-form {
            background: white;
            padding: 50px 40px;
            max-width: 850px;
            margin: 0 auto;
            font-family: 'Times New Roman', Times, serif;
            color: #000;

        .header {
            text-align: center;

        .header p {
            font-size: 12px;
            margin: 3px 0;

        .section {
            margin-bottom: 25px;

        }

        .section-title {
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 12px;
            border-bottom: 1px solid #000;
            padding-bottom: 5px;
            text-transform: uppercase;
        }

        .field-row {
            display: grid;
            grid-template-columns: 1fr 2.5fr;
            gap: 20px;
            margin-bottom: 10px;
            align-items: center;
        }

        .field-row.full {
            grid-template-columns: 1fr;
        }

        .field-label {
            font-size: 12px;
            font-weight: bold;
        }

        .field-value {
            border-bottom: 1px solid #000;
            padding: 2px 0;
            min-height: 18px;
            font-size: 12px;
        }

        .form-input {
            border: none;
            border-bottom: 1px solid #000;
            padding: 4px 0;
            font-size: 13px;
            font-family: 'Times New Roman', Times, serif;
            width: 100%;
            background-color: transparent;
        }

        .form-input:focus {
            outline: none;
            background-color: #fffacd;
        }

        .form-input::placeholder {
            color: #999;
            font-size: 12px;
        }

        .requirement-block {
            margin-bottom: 15px;
            padding: 10px;
            border: 1px solid #ccc;
            background-color: #fafafa;
            page-break-inside: avoid;
        }

        .requirement-title {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 6px;
        }

        .requirement-text {
            font-size: 13px;
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .requirement-check {
            display: flex;
            gap: 30px;
            font-size: 13px;
            margin-top: 5px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .signature-section {
            margin-top: 30px;
            page-break-inside: avoid;
            page-break-before: avoid;
        }

        .signature-block {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            margin-top: 30px;
        }

        .signature-line {
            text-align: center;
        }

        .sig-space {
            border-bottom: 1px solid #000;
            height: 50px;
            margin-bottom: 5px;
        }

        .sig-label {
            font-size: 12px;
            font-weight: bold;
            text-align: center;
        }

        .print-only {
            display: none;
        }

        @media print {
            body {
                background: white;
                padding: 0;
            }

            .selector-section {
                display: none;
            }

            .button-group {
                display: none;
            }

            #formPreview {
                display: block !important;
                box-shadow: none;
                padding: 0;
            }

            .print-form {
                padding: 20px 30px;
                max-width: 100%;
            }

            .print-only {
                display: block;
            }

            .section {
                margin-bottom: 12px;
            }

            .requirement-block {
                margin-bottom: 8px;
                padding: 6px 10px;
            }

            .signature-block {
                margin-top: 15px;
                gap: 20px;
            }

            .sig-space {
                height: 40px;
            }
        }

        .no-selection {
            text-align: center;
            padding: 40px 20px;
            color: #666;
            font-style: italic;
        }

</head>

    <div class="container">
        <div class="selector-section">
            <h2>Tennessee Candidate Qualification Verification Form Generator</h2>
            <p style="margin-bottom: 15px; color: #666; font-size: 14px;">Select the office the candidate is seeking to
                generate a verification form.</p>

            <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div>
                    <label for="inputElectionDate">Election Date:</label>
                    <input type="date" id="inputElectionDate" class="form-input"
                        style="border: 1px solid #ccc; padding: 10px; border-radius: 4px; background-color: white;">
                </div>
                <div>
                    <label for="inputQualifyingDeadline">Qualifying Deadline:</label>
                    <input type="date" id="inputQualifyingDeadline" class="form-input"
                        style="border: 1px solid #ccc; padding: 10px; border-radius: 4px; background-color: white;">
                </div>
            </div>

            <div class="form-group">
                <label for="officeSelect">Office Sought:</label>
                <select id="officeSelect" onchange="generateForm()">
                    <option value="">-- Select an office --</option>
                </select>
            </div>

            <div class="button-group">
                <button class="btn-primary" onclick="printForm()">Print Form</button>
                <button class="btn-secondary" onclick="clearSelection()">Clear</button>
            </div>
        </div>

        <div id="formPreview"></div>
    </div>

                option.value = office;
                option.textContent = office;
                select.appendChild(option);
            });
        }

        function shouldShowRequirement(value) {
            if (!value) return false;
            const normalized = value.toString().trim().toLowerCase();
            return normalized !== 'n/a' && normalized !== 'na' && normalized !== 'none';
        }

        function generateForm() {
            const selectedOffice = document.getElementById('officeSelect').value;
            const preview = document.getElementById('formPreview');

            // Get dates and format logic
            const electionDateVal = document.getElementById('inputElectionDate').value; // YYYY-MM-DD
            const qualDateVal = document.getElementById('inputQualifyingDeadline').value; // YYYY-MM-DD

            function formatDate(isoDate) {
                if (!isoDate) return '';
                const [year, month, day] = isoDate.split('-');
                return `${month}/${day}/${year}`;
            }

            const electionDateFormatted = formatDate(electionDateVal);
            const qualDateFormatted = formatDate(qualDateVal);

            if (!selectedOffice) {
                preview.innerHTML = '';
                preview.style.display = 'none';
                return;
            }

            const req = officeRequirements[selectedOffice];
            const date = new Date().toLocaleDateString('en-US', { year: 'numeric', month: '2-digit', day: '2-digit' });

            let reqIndex = 1;
            let requirementsHtml = '';

            // Age requirement (always shown)
            requirementsHtml += `
                <div class="requirement-block">
                    <div class="requirement-title">${reqIndex}. Age Requirement</div>
                    <div class="requirement-text">Required: ${req.age}</div>
                    <div class="requirement-check">
                        <div class="checkbox-group">
                            <input type="checkbox" id="age_understood">
                            <label for="age_understood">I understand this requirement</label>
                        </div>
                    </div>
                </div>
            `;
            reqIndex++;

            // Residency requirement (only if not N/A)
            if (shouldShowRequirement(req.residency)) {
                requirementsHtml += `
                    <div class="requirement-block">
                        <div class="requirement-title">${reqIndex}. Residency Requirement</div>
                        <div class="requirement-text">Required: ${req.residency}</div>
                        <div class="requirement-check">
                            <div class="checkbox-group">
                                <input type="checkbox" id="res_understood">
                                <label for="res_understood">I understand this requirement</label>
                            </div>
                        </div>
                    </div>
                `;
                reqIndex++;
            }

            // Citizenship requirement (only if not N/A)
            if (shouldShowRequirement(req.citizenship)) {
                requirementsHtml += `
                    <div class="requirement-block">
                        <div class="requirement-title">${reqIndex}. Citizenship Requirement</div>
                        <div class="requirement-text">Required: ${req.citizenship}</div>
                        <div class="requirement-check">
                            <div class="checkbox-group">
                                <input type="checkbox" id="cit_understood">
                                <label for="cit_understood">I understand this requirement</label>
                            </div>
                        </div>
                    </div>
                `;
                reqIndex++;
            }

            // Voter registration status (only if not N/A)
            if (shouldShowRequirement(req.voterStatus)) {
                requirementsHtml += `
                    <div class="requirement-block">
                        <div class="requirement-title">${reqIndex}. Voter Registration Status</div>
                        <div class="requirement-text">Required: ${req.voterStatus}</div>
                        <div class="requirement-check">
                            <div class="checkbox-group">
                                <input type="checkbox" id="voter_understood">
                                <label for="voter_understood">I understand this requirement</label>
                            </div>
                        </div>
                    </div>
                `;
                reqIndex++;
            }

            // Special requirements (only if not "None")
            if (shouldShowRequirement(req.special)) {
                requirementsHtml += `
                    <div class="requirement-block">
                        <div class="requirement-title">${reqIndex}. Special Requirements/Certifications</div>
                        <div class="requirement-text">Required: ${req.special}</div>
                        <div class="requirement-check">
                            <div class="checkbox-group">
                                <input type="checkbox" id="spec_understood">
                                <label for="spec_understood">I understand this requirement</label>
                            </div>
                        </div>
                    </div>
                `;
                reqIndex++;
            }

            // General statutory qualifications (always last)
            requirementsHtml += `
                <div class="requirement-block">
                    <div class="requirement-title">${reqIndex}. General Statutory Qualifications (TCA 2025; § 8-18-101)</div>
                    <div class="requirement-text">
                        No felony conviction (unless full citizenship rights restored) • No unpaid judgment to US/TN/County or default to treasury • Not a regular military member (Army, Navy, Air Force) • Not holding office of profit under foreign power or other state
                    </div>
                    <div class="requirement-check">
                        <div class="checkbox-group">
                            <input type="checkbox" id="gen_understood">
                            <label for="gen_understood">I understand this requirement</label>
                        </div>
                    </div>
                </div>
            `;
            reqIndex++;

            // Nominating Petition Requirement
            requirementsHtml += `
                <div class="requirement-block">
                    <div class="requirement-title">${reqIndex}. Nominating Petition (TCA § 2-5-101)</div>
                    <div class="requirement-text">
                        Candidates must file a nominating petition signed by the candidate and at least twenty-five (25) registered voters who are eligible to vote for that office.
                    </div>
                    <div class="requirement-check">
                        <div class="checkbox-group">
                            <input type="checkbox" id="pet_understood">
                            <label for="pet_understood">I understand this requirement</label>
                        </div>
                    </div>
                </div>
            `;
            reqIndex++;

            // Conflict of Interest Statement
            requirementsHtml += `
                <div class="requirement-block">
                    <div class="requirement-title">${reqIndex}. Statement of Interest (TCA § 8-50-501)</div>
                    <div class="requirement-text">
                        Candidates must file a Statement of Interest disclosure with the Tennessee Ethics Commission within 30 days of the qualifying deadline.
                    </div>
                    <div class="requirement-check">
                        <div class="checkbox-group">
                            <input type="checkbox" id="coi_understood">
                            <label for="coi_understood">I understand this requirement</label>
                        </div>
                    </div>
                </div>
            `;
            reqIndex++;

            // Campaign Finance Registry Identification
            requirementsHtml += `
                <div class="requirement-block">
                    <div class="requirement-title">${reqIndex}. Campaign Finance Registry Identification (PC 1087, § 27)</div>
                    <div class="requirement-text">
                        Candidates cannot receive funds or make expenditures until they submit evidence of identification to the Registry for each officer, person who controls expenditures, and the treasurer.
                    </div>
                    <div class="requirement-check">
                        <div class="checkbox-group">
                            <input type="checkbox" id="cf_id_understood">
                            <label for="cf_id_understood">I understand this requirement</label>
                        </div>
                    </div>
                </div>
            `;
            reqIndex++;

            // Campaign Financial Disclosure Reports
            requirementsHtml += `
                <div class="requirement-block">
                    <div class="requirement-title">${reqIndex}. Campaign Financial Disclosure Reports (TCA § 2-10-107(b))</div>
                    <div class="requirement-text">
                        Candidates must file Campaign Financial Disclosure reports. Candidates will use a short form if contributions and expenditures are $1,000 or less, or a long form if they exceed $1,000. These financial reports must continue to be filed until they reach a $0 balance on hand, $0 loan balance, and $0 obligations.
                    </div>
                    <div class="requirement-check">
                        <div class="checkbox-group">
                            <input type="checkbox" id="cf_disc_understood">
                            <label for="cf_disc_understood">I understand this requirement</label>
                        </div>
                    </div>
                </div>
            `;

            const html = `
                <div class="print-form">
                    <div class="header">
                        <h1>TENNESSEE CANDIDATE QUALIFICATION VERIFICATION FORM</h1>
                        <p>State of Tennessee, County Election Commission</p>
                        <p style="margin-top: 8px;">Pursuant to Tennessee Code Annotated § 8-18-101 et seq.</p>
                    </div>

                    <div class="section">
                        <div class="section-title">CANDIDATE INFORMATION</div>
                        <div class="field-row">
                            <div class="field-label">Candidate Name:</div>
                            <input type="text" class="form-input" id="candidateName">
                        </div>
                        <div class="field-row">
                            <div class="field-label">Date of Birth:</div>
                            <input type="text" class="form-input" id="dateOfBirth">
                        </div>
                        <div class="field-row">
                            <div class="field-label">Voter Registration ID:</div>
                            <input type="text" class="form-input" id="voterRegID">
                        </div>
                        <div class="field-row">
                            <div class="field-label">Jurisdiction:</div>
                            <input type="text" class="form-input" id="jurisdiction">
                        </div>
                        <div class="field-row">
                            <div class="field-label">District/Division:</div>
                            <input type="text" class="form-input" id="district">
                        </div>
                    </div>

                    <div class="section">
                        <div class="section-title">OFFICE INFORMATION</div>
                        <div class="field-row full">
                            <div class="field-label">Office Sought:</div>
                        </div>
                        <div class="field-row full">
                            <div class="field-value" style="border-bottom: none; padding-left: 20px;">${selectedOffice}</div>
                        </div>
                        <div class="field-row">
                            <div class="field-label">Election Date:</div>
                            <input type="text" class="form-input" id="electionDate" value="${electionDateFormatted}">
                        </div>
                        <div class="field-row">
                            <div class="field-label">Qualifying Deadline:</div>
                            <input type="text" class="form-input" id="qualifyingDeadline" value="${qualDateFormatted}">
                        </div>
                    </div>

                    <div class="section">
                        <div class="section-title">QUALIFICATION VERIFICATION - ${selectedOffice.toUpperCase()}</div>
                        ${requirementsHtml}
                    </div>

                    <div class="signature-section">
                        <div class="section-title">CERTIFICATIONS AND SIGNATURES</div>
                        
                        <div style="margin-bottom: 20px;">
                            <div style="font-size: 13px; margin-bottom: 8px;"><strong>Candidate Statement:</strong></div>
                            <div style="font-size: 12px; line-height: 1.4; margin-bottom: 10px;">I hereby certify that the information provided in this application is true, accurate, and complete to the best of my knowledge. I meet all constitutional and statutory qualifications for the office sought.</div>
                            <div class="signature-block">
                                <div class="signature-line">
                                    <div class="sig-space"></div>
                                    <div class="sig-label">Candidate Signature / Date</div>
                                </div>
                                <div class="signature-line">
                                    <div class="sig-space"></div>
                                    <div class="sig-label">Print Name</div>
                                </div>
                            </div>
                        </div>

                        <div>
                            <div style="font-size: 13px; margin-bottom: 8px;"><strong>County Election Commission Certification:</strong></div>
                            <div style="font-size: 12px; line-height: 1.4; margin-bottom: 10px;">I certify that I have verified the above-named candidate's qualifications in accordance with Tennessee law. The information above accurately reflects my findings.</div>
                            <div class="signature-block">
                                <div class="signature-line">
                                    <div class="sig-space"></div>
                                    <div class="sig-label">CEC Official Signature / Date</div>
                                </div>
                                <div class="signature-line">
                                    <div class="sig-space"></div>
                                    <div class="sig-label">Print Name & Title</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="print-only" style="margin-top: 30px; text-align: center; font-size: 10px; color: #666; border-top: 1px solid #ccc; padding-top: 15px;">
                        <p>Form generated: ${date}</p>
                        <p>Office: ${selectedOffice}</p>
                    </div>
                </div>
            `;

            preview.innerHTML = html;
            preview.style.display = 'block';
        }

        function printForm() {
            const selectedOffice = document.getElementById('officeSelect').value;
            if (!selectedOffice) {
                alert('Please select an office first');
                return;
            }
            window.print();
        }

        function clearSelection() {
            document.getElementById('officeSelect').value = '';
            document.getElementById('formPreview').innerHTML = '';
            document.getElementById('formPreview').style.display = 'none';
        }

        document.addEventListener('DOMContentLoaded', initializeDropdown);
    </script>
</body>

</html>
